<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>NYEME ATIRADORA — Neon Space Arcade</title>

<style>
:root {
  --bg: #06111f;
  --bg2: #0b1830;

  --white: #f4fbff;
  --muted: #9bb5ce;

  --cyan: #3ee7ff;
  --blue: #5d8cff;
  --purple: #9b6cff;
  --pink: #ff5bbd;
  --yellow: #ffe15a;
  --green: #65f7a3;
  --red: #ff5277;
  --orange: #ff9d4d;

  --panel: rgba(8, 22, 42, .82);
  --line: rgba(130, 220, 255, .15);

  --glow-cyan: 0 0 18px rgba(62,231,255,.8);
  --glow-pink: 0 0 20px rgba(255,91,189,.75);
  --glow-yellow: 0 0 18px rgba(255,225,90,.8);
  --glow-green: 0 0 18px rgba(101,247,163,.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
}

body {
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    Consolas,
    monospace;

  color: var(--white);
  touch-action: none;
  -webkit-tap-highlight-color: transparent;
}

canvas {
  position: fixed;
  inset: 0;
  display: block;
}

/* =========================================================
   HUD
========================================================= */

#hud {
  position: fixed;
  inset: 0;
  padding: 18px;
  pointer-events: none;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  z-index: 10;
}

.hud-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}

.stat {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
}

.val {
  margin-top: 5px;
  font-size: 27px;
  font-weight: 900;
  line-height: 1;
}

#score .val {
  color: var(--cyan);
  text-shadow: var(--glow-cyan);
}

#wave {
  text-align: right;
}

#wave .val {
  color: var(--pink);
  text-shadow: var(--glow-pink);
}

#combo {
  position: absolute;
  left: 50%;
  top: 18px;
  transform: translateX(-50%) scale(.75);

  color: var(--yellow);
  font-size: 34px;
  font-weight: 900;

  text-shadow: var(--glow-yellow);

  opacity: 0;
  transition:
    opacity .12s ease,
    transform .12s ease;
}

#combo.on {
  opacity: 1;
  transform: translateX(-50%) scale(1);
}

.hud-bottom {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
}

.bars {
  width: min(300px, 48vw);
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.tag {
  color: var(--muted);
  font-size: 9px;
  letter-spacing: .22em;
  text-transform: uppercase;
}

.bar {
  height: 9px;
  overflow: hidden;
  border-radius: 20px;
  background: rgba(255,255,255,.09);
  border: 1px solid rgba(255,255,255,.08);
}

.bar i {
  display: block;
  width: 100%;
  height: 100%;
  transform-origin: left;
  border-radius: inherit;
}

#hpFill {
  background: linear-gradient(
    90deg,
    #4ee895,
    #8dffbd
  );

  box-shadow: var(--glow-green);
}

#dashFill {
  background: linear-gradient(
    90deg,
    #3ee7ff,
    #8d75ff
  );

  box-shadow: var(--glow-cyan);
}

/* =========================================================
   MENU / GAME OVER
========================================================= */

#screen {
  position: fixed;
  inset: 0;

  display: grid;
  place-items: center;

  padding: 20px;

  background:
    radial-gradient(
      circle at 50% 40%,
      rgba(80,80,220,.22),
      rgba(4,13,28,.94) 70%
    );

  backdrop-filter: blur(5px);

  z-index: 20;
}

#screen.hide {
  display: none;
}

.panel {
  width: min(620px, 94vw);
  padding: 34px 30px;

  text-align: center;

  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 22px;

  box-shadow:
    0 25px 80px rgba(0,0,0,.5),
    inset 0 1px rgba(255,255,255,.08);

  animation: panelIn .45s cubic-bezier(.2,.8,.2,1);
}

@keyframes panelIn {
  from {
    opacity: 0;
    transform: translateY(20px) scale(.97);
  }

  to {
    opacity: 1;
    transform: none;
  }
}

h1 {
  font-size: clamp(38px, 10vw, 82px);
  line-height: .9;
  letter-spacing: .07em;
  font-weight: 950;

  color: white;

  text-shadow:
    0 0 10px rgba(255,255,255,.25),
    0 0 30px rgba(62,231,255,.3);
}

h1 span {
  display: block;

  margin-top: 8px;

  color: var(--cyan);

  text-shadow:
    0 0 8px var(--cyan),
    0 0 32px rgba(62,231,255,.7);
}

.sub {
  margin-top: 16px;

  color: var(--muted);

  font-size: 12px;
  letter-spacing: .19em;
  text-transform: uppercase;
}

.keys {
  width: min(390px, 100%);
  margin: 27px auto 0;

  display: grid;
  gap: 9px;

  font-size: 12px;
}

.keys div {
  display: flex;
  justify-content: space-between;
  gap: 20px;

  padding-bottom: 8px;

  border-bottom: 1px dashed rgba(255,255,255,.11);
}

.keys b {
  color: var(--cyan);
}

button {
  margin-top: 30px;

  padding: 15px 38px;

  border: 0;
  border-radius: 12px;

  cursor: pointer;

  color: #04111f;

  background:
    linear-gradient(
      135deg,
      #7af4ff,
      #3ee7ff
    );

  font: inherit;
  font-size: 13px;
  font-weight: 900;

  letter-spacing: .16em;
  text-transform: uppercase;

  box-shadow:
    0 8px 25px rgba(62,231,255,.25),
    var(--glow-cyan);

  transition:
    transform .12s ease,
    filter .12s ease,
    box-shadow .12s ease;
}

button:hover {
  transform: translateY(-2px) scale(1.02);
  filter: brightness(1.08);

  box-shadow:
    0 12px 35px rgba(62,231,255,.3),
    0 0 32px rgba(62,231,255,.8);
}

button:active {
  transform: scale(.97);
}

button:focus-visible {
  outline: 2px solid var(--yellow);
  outline-offset: 4px;
}

.final {
  margin-top: 12px;

  color: var(--muted);

  font-size: 13px;
  letter-spacing: .15em;
  text-transform: uppercase;
}

.final b {
  display: block;

  margin-top: 6px;

  color: var(--yellow);

  font-size: 52px;
  letter-spacing: .02em;

  text-shadow: var(--glow-yellow);
}

.best {
  margin-top: 14px;

  color: var(--muted);

  font-size: 10px;
  letter-spacing: .17em;
  text-transform: uppercase;
}

@media (max-width: 600px) {
  #hud {
    padding: 12px;
  }

  .val {
    font-size: 22px;
  }

  #combo {
    top: 14px;
    font-size: 27px;
  }

  .panel {
    padding: 28px 18px;
  }

  .keys {
    font-size: 11px;
  }
}
</style>
</head>

<body>

<canvas id="game" aria-label="Área de jogo"></canvas>

<!-- =========================================================
     HUD
========================================================= -->

<div id="hud">

  <div class="hud-top">

    <div id="score">
      <div class="stat">Pontos</div>
      <div class="val">0</div>
    </div>

    <div id="combo">x1</div>

    <div id="wave">
      <div class="stat">Onda</div>
      <div class="val">1</div>
    </div>

  </div>

  <div class="hud-bottom">

    <div class="bars">

      <div class="tag">Casco</div>
      <div class="bar">
        <i id="hpFill"></i>
      </div>

      <div class="tag">Impulso</div>
      <div class="bar">
        <i id="dashFill"></i>
      </div>

    </div>

  </div>

</div>

<!-- =========================================================
     MENU
========================================================= -->

<div id="screen">

  <div class="panel" id="panel">

    <h1>
      NYEME
      <span>ATIRADORA</span>
    </h1>

    <p class="sub">
      Sobreviva às ondas · SENAI
    </p>

    <div class="keys">

      <div>
        <span>Mover</span>
        <b>W A S D / SETAS</b>
      </div>

      <div>
        <span>Mirar</span>
        <b>MOUSE</b>
      </div>

      <div>
        <span>Atirar</span>
        <b>AUTOMÁTICO</b>
      </div>

      <div>
        <span>Impulso</span>
        <b>ESPAÇO</b>
      </div>

      <div>
        <span>Pausar</span>
        <b>P</b>
      </div>

      <div>
        <span>Celular</span>
        <b>ARRASTE</b>
      </div>

    </div>

    <button id="startBtn">
      Começar
    </button>

  </div>

</div>

<script>
"use strict";

/* =========================================================
   CONFIGURAÇÕES
========================================================= */

const CONFIG = {

  maxDpr: 1.5,

  maxEnemies: 48,
  maxParticles: 360,
  maxBullets: 90,
  maxEnemyShots: 35,

  playerSpeed: 330,

  bulletSpeed: 820,
  fireRate: .105,

  dashCooldown: .9,
  dashDuration: .15,

  waveDuration: 20

};


/* =========================================================
   CANVAS
========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d", {
  alpha: false
});

let W = 0;
let H = 0;
let DPR = 1;

let stars = [];

function resize() {

  DPR = Math.min(
    window.devicePixelRatio || 1,
    CONFIG.maxDpr
  );

  W = window.innerWidth;
  H = window.innerHeight;

  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);

  canvas.style.width = W + "px";
  canvas.style.height = H + "px";

  ctx.setTransform(
    DPR,
    0,
    0,
    DPR,
    0,
    0
  );

  createStars();
}

function createStars() {

  const amount = Math.min(
    150,
    Math.floor(W * H / 9000)
  );

  stars = [];

  for (let i = 0; i < amount; i++) {

    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.5 + .3,
      speed: Math.random() * 18 + 5,
      alpha: Math.random() * .65 + .2
    });

  }
}

addEventListener("resize", resize);
resize();


/* =========================================================
   MATH
========================================================= */

const TAU = Math.PI * 2;

const rand = (a, b) =>
  a + Math.random() * (b - a);

const randi = (a, b) =>
  Math.floor(rand(a, b + 1));

const clamp = (v, a, b) =>
  v < a ? a : v > b ? b : v;

function distanceSq(a, b) {

  const dx = a.x - b.x;
  const dy = a.y - b.y;

  return dx * dx + dy * dy;
}


/* =========================================================
   ÁUDIO
========================================================= */

let AC = null;

function audioOn() {

  if (!AC) {

    AC = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();

  }

  if (AC.state === "suspended") {
    AC.resume();
  }
}

function tone(
  freq,
  duration = .08,
  type = "sine",
  volume = .035,
  slide = 0
) {

  if (!AC) return;

  const now = AC.currentTime;

  const osc = AC.createOscillator();
  const gain = AC.createGain();

  osc.type = type;

  osc.frequency.setValueAtTime(freq, now);

  if (slide) {

    osc.frequency.exponentialRampToValueAtTime(
      Math.max(40, slide),
      now + duration
    );

  }

  gain.gain.setValueAtTime(volume, now);

  gain.gain.exponentialRampToValueAtTime(
    .0001,
    now + duration
  );

  osc.connect(gain);
  gain.connect(AC.destination);

  osc.start(now);
  osc.stop(now + duration + .02);
}


/* =========================================================
   INPUT
========================================================= */

const keys = Object.create(null);

addEventListener("keydown", e => {

  keys[e.code] = true;

  if (
    [
      "Space",
      "ArrowUp",
      "ArrowDown",
      "ArrowLeft",
      "ArrowRight"
    ].includes(e.code)
  ) {
    e.preventDefault();
  }

  if (
    e.code === "KeyP" &&
    game.state === "play"
  ) {
    game.paused = !game.paused;
  }

  if (
    e.code === "Enter" &&
    game.state !== "play"
  ) {
    start();
  }

});

addEventListener("keyup", e => {
  keys[e.code] = false;
});


/* =========================================================
   MOUSE
========================================================= */

const mouse = {
  x: W / 2,
  y: H / 2,
  active: false
};

addEventListener("mousemove", e => {

  mouse.x = e.clientX;
  mouse.y = e.clientY;

  mouse.active = true;

});


/* =========================================================
   TOUCH
========================================================= */

const touch = {

  active: false,

  ox: 0,
  oy: 0,

  dx: 0,
  dy: 0

};

canvas.addEventListener(
  "touchstart",
  e => {

    e.preventDefault();
    audioOn();

    const t = e.changedTouches[0];

    touch.active = true;

    touch.ox = t.clientX;
    touch.oy = t.clientY;

    touch.dx = 0;
    touch.dy = 0;

  },
  { passive: false }
);

canvas.addEventListener(
  "touchmove",
  e => {

    e.preventDefault();

    const t = e.changedTouches[0];

    let dx = t.clientX - touch.ox;
    let dy = t.clientY - touch.oy;

    const length = Math.hypot(dx, dy);

    const max = 70;

    if (length > max) {

      dx *= max / length;
      dy *= max / length;

    }

    touch.dx = dx / max;
    touch.dy = dy / max;

  },
  { passive: false }
);

canvas.addEventListener(
  "touchend",
  e => {

    e.preventDefault();

    touch.active = false;

    touch.dx = 0;
    touch.dy = 0;

  },
  { passive: false }
);


/* =========================================================
   GAME STATE
========================================================= */

const game = {

  state: "menu",

  paused: false,

  score: 0,
  best: Number(
    localStorage.getItem("nyeme-best") || 0
  ),

  wave: 1,
  waveTimer: 0,

  combo: 1,
  comboTimer: 0,

  spawnTimer: .4,

  shake: 0,
  flash: 0,

  slow: 1,

  time: 0

};

let player;
let bullets;
let enemies;
let enemyShots;
let particles;
let drops;
let floats;


/* =========================================================
   INIMIGOS
========================================================= */

const TYPES = {

  drone: {
    r: 15,
    hp: 3,
    speed: 105,
    color: "#ff5bbd",
    points: 10,
    damage: 12
  },

  runner: {
    r: 11,
    hp: 1,
    speed: 240,
    color: "#ffe15a",
    points: 18,
    damage: 9
  },

  tank: {
    r: 28,
    hp: 11,
    speed: 54,
    color: "#9b6cff",
    points: 45,
    damage: 25
  },

  sniper: {
    r: 15,
    hp: 4,
    speed: 72,
    color: "#3ee7ff",
    points: 32,
    damage: 12
  }

};


/* =========================================================
   RESET
========================================================= */

function reset() {

  player = {

    x: W / 2,
    y: H / 2,

    vx: 0,
    vy: 0,

    r: 14,

    angle: -Math.PI / 2,

    hp: 100,
    maxHp: 100,

    speed: CONFIG.playerSpeed,

    fireCooldown: 0,

    dashCooldown: 0,
    dashTime: 0,

    invincible: 0,

    triple: 0,
    shield: 0

  };

  bullets = [];
  enemies = [];
  enemyShots = [];
  particles = [];
  drops = [];
  floats = [];

  game.score = 0;
  game.wave = 1;

  game.waveTimer = 0;
  game.combo = 1;
  game.comboTimer = 0;

  game.spawnTimer = .4;

  game.shake = 0;
  game.flash = 0;

  game.slow = 1;
  game.time = 0;

  game.paused = false;
}


/* =========================================================
   PARTICLES
========================================================= */

function particleBurst(
  x,
  y,
  color,
  amount,
  speed = 250,
  life = .5
) {

  amount = Math.min(
    amount,
    CONFIG.maxParticles - particles.length
  );

  for (let i = 0; i < amount; i++) {

    const a = Math.random() * TAU;
    const s = rand(speed * .2, speed);

    particles.push({

      x,
      y,

      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s,

      r: rand(1, 3.5),

      life: rand(life * .45, life),
      maxLife: life,

      color

    });

  }

}


/* =========================================================
   FLOAT TEXT
========================================================= */

function floatingText(
  x,
  y,
  text,
  color
) {

  floats.push({

    x,
    y,

    text,
    color,

    life: .8

  });

}


/* =========================================================
   SPAWN INIMIGO
========================================================= */

function spawnEnemy() {

  if (
    enemies.length >=
    CONFIG.maxEnemies
  ) {
    return;
  }

  let pool = [
    "drone",
    "drone",
    "runner"
  ];

  if (game.wave >= 2) {
    pool.push("tank");
  }

  if (game.wave >= 3) {
    pool.push("sniper", "runner");
  }

  if (game.wave >= 5) {
    pool.push("tank", "sniper");
  }

  const typeName =
    pool[randi(0, pool.length - 1)];

  const type = TYPES[typeName];

  const side = randi(0, 3);

  const margin = 80;

  let x;
  let y;

  if (side === 0) {
    x = rand(0, W);
    y = -margin;
  }

  else if (side === 1) {
    x = W + margin;
    y = rand(0, H);
  }

  else if (side === 2) {
    x = rand(0, W);
    y = H + margin;
  }

  else {
    x = -margin;
    y = rand(0, H);
  }

  const difficulty =
    1 + (game.wave - 1) * .065;

  const hp =
    Math.ceil(type.hp * difficulty);

  enemies.push({

    type: typeName,

    x,
    y,

    vx: 0,
    vy: 0,

    r: type.r,

    hp,
    maxHp: hp,

    speed:
      type.speed *
      Math.min(difficulty, 1.65),

    color: type.color,

    points: type.points,
    damage: type.damage,

    angle: 0,

    hit: 0,

    shotCooldown: rand(1.2, 2.5),

    phase: Math.random() * TAU

  });

}


/* =========================================================
   TIRO
========================================================= */

function shoot() {

  if (
    bullets.length >=
    CONFIG.maxBullets
  ) {
    return;
  }

  const spread =
    player.triple > 0
      ? [-.18, 0, .18]
      : [0];

  for (const offset of spread) {

    if (
      bullets.length >=
      CONFIG.maxBullets
    ) {
      break;
    }

    const angle =
      player.angle + offset;

    bullets.push({

      x:
        player.x +
        Math.cos(angle) * 20,

      y:
        player.y +
        Math.sin(angle) * 20,

      vx:
        Math.cos(angle) *
        CONFIG.bulletSpeed,

      vy:
        Math.sin(angle) *
        CONFIG.bulletSpeed,

      r: 4,

      life: .9

    });

  }

  tone(
    rand(650, 760),
    .035,
    "square",
    .018,
    320
  );

  player.fireCooldown =
    CONFIG.fireRate;

}


/* =========================================================
   DANO NO JOGADOR
========================================================= */

function hurt(amount, sourceX, sourceY) {

  if (
    player.invincible > 0 ||
    player.dashTime > 0
  ) {
    return;
  }

  if (player.shield > 0) {

    player.shield = 0;
    player.invincible = .7;

    particleBurst(
      player.x,
      player.y,
      "#3ee7ff",
      30,
      340
    );

    game.shake =
      Math.max(game.shake, 10);

    tone(
      180,
      .2,
      "sine",
      .06,
      70
    );

    return;
  }

  player.hp -= amount;

  player.invincible = .85;

  game.combo = 1;
  game.comboTimer = 0;

  game.shake =
    Math.max(game.shake, 14);

  game.flash = .3;

  particleBurst(
    player.x,
    player.y,
    "#ff5277",
    24,
    300
  );

  const angle = Math.atan2(
    player.y - sourceY,
    player.x - sourceX
  );

  player.vx +=
    Math.cos(angle) * 260;

  player.vy +=
    Math.sin(angle) * 260;

  tone(
    110,
    .18,
    "sawtooth",
    .05,
    50
  );

  if (player.hp <= 0) {

    player.hp = 0;

    gameOver();

  }

}


/* =========================================================
   MORTE DO INIMIGO
========================================================= */

function killEnemy(enemy, index) {

  enemies.splice(index, 1);

  const points = Math.round(
    enemy.points * game.combo
  );

  game.score += points;

  game.combo =
    Math.min(game.combo + 1, 99);

  game.comboTimer = 2.4;

  const big =
    enemy.type === "tank";

  particleBurst(
    enemy.x,
    enemy.y,
    enemy.color,
    big ? 45 : 20,
    big ? 430 : 290,
    big ? .8 : .55
  );

  floatingText(
    enemy.x,
    enemy.y,
    "+" + points,
    enemy.color
  );

  game.shake =
    Math.max(
      game.shake,
      big ? 13 : 5
    );

  tone(
    big ? 180 : rand(280, 380),
    big ? .18 : .08,
    "triangle",
    big ? .07 : .025,
    big ? 70 : 120
  );

  if (big) {

    game.slow = .35;

    for (let i = 0; i < 3; i++) {

      const type = TYPES.runner;
      const angle = rand(0, TAU);

      enemies.push({

        type: "runner",

        x:
          enemy.x +
          Math.cos(angle) * 25,

        y:
          enemy.y +
          Math.sin(angle) * 25,

        vx: 0,
        vy: 0,

        r: type.r,

        hp: 1,
        maxHp: 1,

        speed: type.speed,

        color: type.color,

        points: type.points,
        damage: type.damage,

        angle: angle,

        hit: 0,

        shotCooldown: 99,

        phase: Math.random() * TAU

      });

    }

  }

  if (Math.random() < .13) {
    spawnPickup(
      enemy.x,
      enemy.y
    );
  }

}


/* =========================================================
   PICKUPS
========================================================= */

function spawnPickup(x, y) {

  const kinds = [
    "triple",
    "shield",
    "heal"
  ];

  drops.push({

    x,
    y,

    kind:
      kinds[randi(0, 2)],

    r: 13,

    life: 12,

    time: 0

  });

}


/* =========================================================
   UPDATE
========================================================= */

function update(dt) {

  game.time += dt;

  /* -------------------------------------------------------
     MOVIMENTO
  ------------------------------------------------------- */

  let mx =
    (keys.KeyD || keys.ArrowRight ? 1 : 0) -
    (keys.KeyA || keys.ArrowLeft ? 1 : 0);

  let my =
    (keys.KeyS || keys.ArrowDown ? 1 : 0) -
    (keys.KeyW || keys.ArrowUp ? 1 : 0);

  if (touch.active) {

    mx = touch.dx;
    my = touch.dy;

  }

  const moveLength =
    Math.hypot(mx, my);

  if (moveLength > 1) {

    mx /= moveLength;
    my /= moveLength;

  }

  /* -------------------------------------------------------
     DASH
  ------------------------------------------------------- */

  player.dashCooldown =
    Math.max(
      0,
      player.dashCooldown - dt
    );

  player.dashTime =
    Math.max(
      0,
      player.dashTime - dt
    );

  if (
    keys.Space &&
    player.dashCooldown <= 0 &&
    moveLength > .1
  ) {

    player.dashTime =
      CONFIG.dashDuration;

    player.dashCooldown =
      CONFIG.dashCooldown;

    particleBurst(
      player.x,
      player.y,
      "#8d75ff",
      20,
      250,
      .35
    );

    tone(
      360,
      .12,
      "sine",
      .045,
      900
    );

    keys.Space = false;

  }

  const targetSpeed =
    player.dashTime > 0
      ? player.speed * 3.8
      : player.speed;

  const acceleration =
    Math.min(1, dt * 15);

  player.vx +=
    (mx * targetSpeed - player.vx) *
    acceleration;

  player.vy +=
    (my * targetSpeed - player.vy) *
    acceleration;

  player.x = clamp(
    player.x + player.vx * dt,
    player.r,
    W - player.r
  );

  player.y = clamp(
    player.y + player.vy * dt,
    player.r,
    H - player.r
  );


  /* -------------------------------------------------------
     MIRA
  ------------------------------------------------------- */

  let closest = null;
  let closestDistance = Infinity;

  for (const enemy of enemies) {

    const d =
      distanceSq(enemy, player);

    if (d < closestDistance) {

      closestDistance = d;
      closest = enemy;

    }

  }

  if (
    mouse.active &&
    !touch.active
  ) {

    player.angle = Math.atan2(
      mouse.y - player.y,
      mouse.x - player.x
    );

  }

  else if (closest) {

    player.angle = Math.atan2(
      closest.y - player.y,
      closest.x - player.x
    );

  }


  /* -------------------------------------------------------
     TIRO AUTOMÁTICO
  ------------------------------------------------------- */

  player.fireCooldown -= dt;

  if (
    player.fireCooldown <= 0 &&
    enemies.length
  ) {
    shoot();
  }

  player.invincible =
    Math.max(
      0,
      player.invincible - dt
    );

  player.triple =
    Math.max(
      0,
      player.triple - dt
    );


  /* -------------------------------------------------------
     ONDAS
  ------------------------------------------------------- */

  game.waveTimer += dt;

  if (
    game.waveTimer >=
    CONFIG.waveDuration
  ) {

    game.waveTimer = 0;

    game.wave++;

    floatingText(
      W / 2,
      H / 2 - 70,
      "ONDA " + game.wave,
      "#3ee7ff"
    );

    game.shake =
      Math.max(game.shake, 8);

    tone(
      180,
      .3,
      "sawtooth",
      .04,
      600
    );

  }


  /* -------------------------------------------------------
     SPAWN
  ------------------------------------------------------- */

  game.spawnTimer -= dt;

  if (
    game.spawnTimer <= 0 &&
    enemies.length <
    CONFIG.maxEnemies
  ) {

    spawnEnemy();

    game.spawnTimer =
      Math.max(
        .16,
        1.15 -
        game.wave * .075
      );

  }


  /* -------------------------------------------------------
     BALAS DO JOGADOR
  ------------------------------------------------------- */

  for (
    let i = bullets.length - 1;
    i >= 0;
    i--
  ) {

    const bullet = bullets[i];

    bullet.x +=
      bullet.vx * dt;

    bullet.y +=
      bullet.vy * dt;

    bullet.life -= dt;

    if (
      bullet.life <= 0 ||
      bullet.x < -50 ||
      bullet.x > W + 50 ||
      bullet.y < -50 ||
      bullet.y > H + 50
    ) {

      bullets.splice(i, 1);
      continue;

    }

    let hit = false;

    for (
      let j = enemies.length - 1;
      j >= 0;
      j--
    ) {

      const enemy = enemies[j];

      const radius =
        bullet.r + enemy.r;

      if (
        distanceSq(
          bullet,
          enemy
        ) < radius * radius
      ) {

        enemy.hp--;

        enemy.hit = .1;

        particleBurst(
          bullet.x,
          bullet.y,
          "#ffffff",
          5,
          150,
          .25
        );

        bullets.splice(i, 1);

        hit = true;

        if (enemy.hp <= 0) {
          killEnemy(enemy, j);
        }

        break;

      }

    }

    if (hit) continue;

  }


  /* -------------------------------------------------------
     INIMIGOS
  ------------------------------------------------------- */

  for (
    let i = enemies.length - 1;
    i >= 0;
    i--
  ) {

    const enemy = enemies[i];

    enemy.hit =
      Math.max(
        0,
        enemy.hit - dt
      );

    const dx =
      player.x - enemy.x;

    const dy =
      player.y - enemy.y;

    const distance =
      Math.hypot(dx, dy) || 1;

    const angle =
      Math.atan2(dy, dx);

    enemy.angle = angle;

    if (enemy.type === "sniper") {

      let direction = 0;

      if (distance < 240) {
        direction = -1;
      }

      else if (distance > 370) {
        direction = 1;
      }

      enemy.vx =
        Math.cos(angle) *
        enemy.speed *
        direction;

      enemy.vy =
        Math.sin(angle) *
        enemy.speed *
        direction;

      enemy.shotCooldown -= dt;

      if (
        enemy.shotCooldown <= 0 &&
        distance < 700 &&
        enemyShots.length <
        CONFIG.maxEnemyShots
      ) {

        enemy.shotCooldown =
          rand(1.3, 2.2);

        enemyShots.push({

          x: enemy.x,
          y: enemy.y,

          vx:
            Math.cos(angle) * 300,

          vy:
            Math.sin(angle) * 300,

          r: 6,

          life: 4

        });

        tone(
          280,
          .08,
          "sawtooth",
          .025,
          130
        );

      }

    }

    else {

      enemy.vx =
        Math.cos(angle) *
        enemy.speed;

      enemy.vy =
        Math.sin(angle) *
        enemy.speed;

    }

    /* pequeno movimento lateral dos drones */

    if (
      enemy.type === "drone"
    ) {

      const wave =
        Math.sin(
          game.time * 4 +
          enemy.phase
        ) * 20;

      enemy.vx +=
        Math.cos(angle + Math.PI / 2) *
        wave;

      enemy.vy +=
        Math.sin(angle + Math.PI / 2) *
        wave;

    }

    enemy.x +=
      enemy.vx * dt;

    enemy.y +=
      enemy.vy * dt;


    /* separação */

    for (
      let j = i - 1;
      j >= 0;
      j--
    ) {

      const other = enemies[j];

      const radius =
        enemy.r + other.r;

      const d2 =
        distanceSq(
          enemy,
          other
        );

      if (
        d2 <
        radius * radius &&
        d2 > .01
      ) {

        const d =
          Math.sqrt(d2);

        const push =
          (radius - d) /
          d *
          .45;

        const px =
          (enemy.x - other.x) *
          push;

        const py =
          (enemy.y - other.y) *
          push;

        enemy.x += px;
        enemy.y += py;

        other.x -= px;
        other.y -= py;

      }

    }


    /* colisão jogador */

    const radius =
      enemy.r + player.r;

    if (
      distanceSq(
        enemy,
        player
      ) < radius * radius
    ) {

      hurt(
        enemy.damage,
        enemy.x,
        enemy.y
      );

    }

  }


  /* -------------------------------------------------------
     TIROS INIMIGOS
  ------------------------------------------------------- */

  for (
    let i = enemyShots.length - 1;
    i >= 0;
    i--
  ) {

    const shot =
      enemyShots[i];

    shot.x +=
      shot.vx * dt;

    shot.y +=
      shot.vy * dt;

    shot.life -= dt;

    if (
      shot.life <= 0 ||
      shot.x < -50 ||
      shot.x > W + 50 ||
      shot.y < -50 ||
      shot.y > H + 50
    ) {

      enemyShots.splice(i, 1);
      continue;

    }

    const radius =
      shot.r + player.r;

    if (
      distanceSq(
        shot,
        player
      ) < radius * radius
    ) {

      hurt(
        10,
        shot.x,
        shot.y
      );

      enemyShots.splice(i, 1);

    }

  }


  /* -------------------------------------------------------
     PICKUPS
  ------------------------------------------------------- */

  for (
    let i = drops.length - 1;
    i >= 0;
    i--
  ) {

    const pickup =
      drops[i];

    pickup.life -= dt;
    pickup.time += dt;

    if (pickup.life <= 0) {

      drops.splice(i, 1);
      continue;

    }

    const radius =
      pickup.r +
      player.r +
      10;

    if (
      distanceSq(
        pickup,
        player
      ) < radius * radius
    ) {

      if (
        pickup.kind === "triple"
      ) {

        player.triple = 9;

        floatingText(
          pickup.x,
          pickup.y,
          "TIRO TRIPLO",
          "#ffe15a"
        );

      }

      else if (
        pickup.kind === "shield"
      ) {

        player.shield = 1;

        floatingText(
          pickup.x,
          pickup.y,
          "ESCUDO",
          "#3ee7ff"
        );

      }

      else {

        player.hp =
          Math.min(
            player.maxHp,
            player.hp + 30
          );

        floatingText(
          pickup.x,
          pickup.y,
          "+30 CASCO",
          "#65f7a3"
        );

      }

      particleBurst(
        pickup.x,
        pickup.y,
        "#ffffff",
        18,
        220
      );

      tone(
        600,
        .1,
        "sine",
        .04,
        1000
      );

      drops.splice(i, 1);

    }

  }


  /* -------------------------------------------------------
     PARTÍCULAS
  ------------------------------------------------------- */

  for (
    let i = particles.length - 1;
    i >= 0;
    i--
  ) {

    const p = particles[i];

    p.x += p.vx * dt;
    p.y += p.vy * dt;

    p.vx *= .93;
    p.vy *= .93;

    p.life -= dt;

    if (p.life <= 0) {
      particles.splice(i, 1);
    }

  }


  /* -------------------------------------------------------
     TEXTOS
  ------------------------------------------------------- */

  for (
    let i = floats.length - 1;
    i >= 0;
    i--
  ) {

    const f = floats[i];

    f.y -= 35 * dt;
    f.life -= dt;

    if (f.life <= 0) {
      floats.splice(i, 1);
    }

  }


  /* -------------------------------------------------------
     EFEITOS
  ------------------------------------------------------- */

  if (game.comboTimer > 0) {

    game.comboTimer -= dt;

    if (game.comboTimer <= 0) {
      game.combo = 1;
    }

  }

  game.shake =
    Math.max(
      0,
      game.shake - dt * 45
    );

  game.flash =
    Math.max(
      0,
      game.flash - dt * 2.5
    );

  game.slow +=
    (1 - game.slow) *
    Math.min(
      1,
      dt * 5
    );

}


/* =========================================================
   DESENHO DO FUNDO
========================================================= */

function drawBackground() {

  const gradient =
    ctx.createLinearGradient(
      0,
      0,
      0,
      H
    );

  gradient.addColorStop(
    0,
    "#071a30"
  );

  gradient.addColorStop(
    .55,
    "#061323"
  );

  gradient.addColorStop(
    1,
    "#030b16"
  );

  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, W, H);


  /* estrelas */

  ctx.fillStyle = "#bdeeff";

  for (const star of stars) {

    star.y +=
      star.speed *
      .016;

    if (star.y > H + 5) {
      star.y = -5;
      star.x = Math.random() * W;
    }

    ctx.globalAlpha =
      star.alpha;

    ctx.beginPath();

    ctx.arc(
      star.x,
      star.y,
      star.r,
      0,
      TAU
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;


  /* grade */

  const gridSize = 70;

  const offsetX =
    -(player.x * .08) %
    gridSize;

  const offsetY =
    -(player.y * .08) %
    gridSize;

  ctx.strokeStyle =
    "rgba(76,178,255,.09)";

  ctx.lineWidth = 1;

  ctx.beginPath();

  for (
    let x = offsetX;
    x < W + gridSize;
    x += gridSize
  ) {

    ctx.moveTo(x, 0);
    ctx.lineTo(x, H);

  }

  for (
    let y = offsetY;
    y < H + gridSize;
    y += gridSize
  ) {

    ctx.moveTo(0, y);
    ctx.lineTo(W, y);

  }

  ctx.stroke();

}


/* =========================================================
   PICKUPS
========================================================= */

function drawPickup(pickup) {

  let color;

  if (
    pickup.kind === "triple"
  ) {
    color = "#ffe15a";
  }

  else if (
    pickup.kind === "shield"
  ) {
    color = "#3ee7ff";
  }

  else {
    color = "#65f7a3";
  }

  const pulse =
    1 +
    Math.sin(
      pickup.time * 7
    ) * .13;

  const alpha =
    pickup.life < 3
      ? .55 +
        Math.sin(
          pickup.life * 14
        ) * .4
      : 1;

  ctx.save();

  ctx.translate(
    pickup.x,
    pickup.y
  );

  ctx.rotate(
    pickup.time * 1.5
  );

  ctx.scale(
    pulse,
    pulse
  );

  ctx.globalAlpha =
    alpha;

  ctx.strokeStyle =
    color;

  ctx.fillStyle =
    color;

  ctx.lineWidth = 2;

  ctx.beginPath();

  ctx.moveTo(0, -14);
  ctx.lineTo(12, 0);
  ctx.lineTo(0, 14);
  ctx.lineTo(-12, 0);

  ctx.closePath();

  ctx.globalAlpha =
    alpha * .15;

  ctx.fill();

  ctx.globalAlpha =
    alpha;

  ctx.stroke();

  ctx.restore();

}


/* =========================================================
   DESENHO DOS INIMIGOS
========================================================= */

function drawEnemy(enemy) {

  const color =
    enemy.hit > 0
      ? "#ffffff"
      : enemy.color;

  ctx.save();

  ctx.translate(
    enemy.x,
    enemy.y
  );

  ctx.rotate(
    enemy.angle
  );

  ctx.strokeStyle =
    color;

  ctx.fillStyle =
    color;

  ctx.lineWidth = 2;

  /* -------------------------------------------------------
     DRONE
  ------------------------------------------------------- */

  if (
    enemy.type === "drone"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      enemy.r,
      0
    );

    ctx.lineTo(
      enemy.r * .35,
      enemy.r * .75
    );

    ctx.lineTo(
      -enemy.r * .8,
      enemy.r * .55
    );

    ctx.lineTo(
      -enemy.r * .55,
      0
    );

    ctx.lineTo(
      -enemy.r * .8,
      -enemy.r * .55
    );

    ctx.lineTo(
      enemy.r * .35,
      -enemy.r * .75
    );

    ctx.closePath();

    ctx.globalAlpha = .18;
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.stroke();

    /* núcleo */

    ctx.fillStyle = "#ffffff";

    ctx.beginPath();

    ctx.arc(
      0,
      0,
      3,
      0,
      TAU
    );

    ctx.fill();

  }


  /* -------------------------------------------------------
     RUNNER
  ------------------------------------------------------- */

  else if (
    enemy.type === "runner"
  ) {

    ctx.beginPath();

    ctx.moveTo(
      enemy.r * 1.4,
      0
    );

    ctx.lineTo(
      -enemy.r,
      -enemy.r * .8
    );

    ctx.lineTo(
      -enemy.r * .65,
      0
    );

    ctx.lineTo(
      -enemy.r,
      enemy.r * .8
    );

    ctx.closePath();

    ctx.globalAlpha = .2;
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.stroke();

  }


  /* -------------------------------------------------------
     TANK
  ------------------------------------------------------- */

  else if (
    enemy.type === "tank"
  ) {

    ctx.beginPath();

    for (
      let i = 0;
      i < 8;
      i++
    ) {

      const a =
        i / 8 * TAU;

      const radius =
        i % 2 === 0
          ? enemy.r
          : enemy.r * .82;

      const x =
        Math.cos(a) *
        radius;

      const y =
        Math.sin(a) *
        radius;

      if (i === 0) {
        ctx.moveTo(x, y);
      }

      else {
        ctx.lineTo(x, y);
      }

    }

    ctx.closePath();

    ctx.globalAlpha = .18;
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.stroke();

    /* centro */

    ctx.beginPath();

    ctx.rect(
      -7,
      -7,
      14,
      14
    );

    ctx.stroke();

  }


  /* -------------------------------------------------------
     SNIPER
  ------------------------------------------------------- */

  else {

    ctx.beginPath();

    ctx.moveTo(
      enemy.r * 1.4,
      0
    );

    ctx.lineTo(
      -enemy.r * .8,
      -enemy.r
    );

    ctx.lineTo(
      -enemy.r * .8,
      enemy.r
    );

    ctx.closePath();

    ctx.globalAlpha = .17;
    ctx.fill();

    ctx.globalAlpha = 1;
    ctx.stroke();

    /* mira */

    ctx.beginPath();

    ctx.moveTo(
      -enemy.r * .3,
      0
    );

    ctx.lineTo(
      enemy.r * .8,
      0
    );

    ctx.stroke();

  }

  ctx.restore();


  /* barra de vida */

  if (
    enemy.hp <
    enemy.maxHp
  ) {

    const width =
      enemy.r * 2;

    const health =
      enemy.hp /
      enemy.maxHp;

    ctx.fillStyle =
      "rgba(255,255,255,.12)";

    ctx.fillRect(
      enemy.x - enemy.r,
      enemy.y - enemy.r - 9,
      width,
      3
    );

    ctx.fillStyle =
      enemy.color;

    ctx.fillRect(
      enemy.x - enemy.r,
      enemy.y - enemy.r - 9,
      width * health,
      3
    );

  }

}


/* =========================================================
   DESENHO DA NAVE
========================================================= */

function drawPlayer() {

  const blink =
    player.invincible > 0 &&
    Math.floor(
      player.invincible * 20
    ) % 2 === 0;

  if (blink) {
    return;
  }

  ctx.save();

  ctx.translate(
    player.x,
    player.y
  );

  ctx.rotate(
    player.angle
  );


  /* chama do motor */

  if (
    Math.abs(player.vx) +
    Math.abs(player.vy) > 30
  ) {

    const flame =
      9 +
      Math.random() * 10;

    ctx.fillStyle =
      "#ffe15a";

    ctx.beginPath();

    ctx.moveTo(
      -12,
      -5
    );

    ctx.lineTo(
      -12 - flame,
      0
    );

    ctx.lineTo(
      -12,
      5
    );

    ctx.closePath();

    ctx.fill();

  }


  /* asa externa */

  ctx.fillStyle =
    "rgba(93,140,255,.22)";

  ctx.strokeStyle =
    "#8ddcff";

  ctx.lineWidth = 2.4;

  ctx.beginPath();

  ctx.moveTo(
    22,
    0
  );

  ctx.lineTo(
    -8,
    -15
  );

  ctx.lineTo(
    -5,
    0
  );

  ctx.lineTo(
    -8,
    15
  );

  ctx.closePath();

  ctx.fill();
  ctx.stroke();


  /* corpo central */

  ctx.fillStyle =
    "#f4fbff";

  ctx.strokeStyle =
    "#3ee7ff";

  ctx.beginPath();

  ctx.moveTo(
    19,
    0
  );

  ctx.lineTo(
    -6,
    -7
  );

  ctx.lineTo(
    -10,
    0
  );

  ctx.lineTo(
    -6,
    7
  );

  ctx.closePath();

  ctx.fill();
  ctx.stroke();


  /* cockpit */

  ctx.fillStyle =
    "#9b6cff";

  ctx.beginPath();

  ctx.ellipse(
    4,
    0,
    6,
    3.5,
    0,
    0,
    TAU
  );

  ctx.fill();


  /* canhão */

  ctx.strokeStyle =
    "#ffffff";

  ctx.lineWidth = 3;

  ctx.beginPath();

  ctx.moveTo(
    9,
    0
  );

  ctx.lineTo(
    25,
    0
  );

  ctx.stroke();

  ctx.restore();


  /* escudo */

  if (
    player.shield > 0
  ) {

    const alpha =
      .55 +
      Math.sin(
        performance.now() / 130
      ) * .2;

    ctx.globalAlpha =
      alpha;

    ctx.strokeStyle =
      "#3ee7ff";

    ctx.lineWidth = 2;

    ctx.beginPath();

    ctx.arc(
      player.x,
      player.y,
      player.r + 13,
      0,
      TAU
    );

    ctx.stroke();

    ctx.globalAlpha = 1;

  }

}


/* =========================================================
   RENDER
========================================================= */

function render() {

  drawBackground();

  ctx.save();

  if (
    game.shake > .2
  ) {

    ctx.translate(
      rand(
        -game.shake,
        game.shake
      ),
      rand(
        -game.shake,
        game.shake
      )
    );

  }


  /* pickups */

  for (
    const pickup of drops
  ) {

    drawPickup(pickup);

  }


  /* partículas */

  for (
    const particle of particles
  ) {

    ctx.globalAlpha =
      clamp(
        particle.life /
        particle.maxLife,
        0,
        1
      );

    ctx.fillStyle =
      particle.color;

    ctx.beginPath();

    ctx.arc(
      particle.x,
      particle.y,
      particle.r,
      0,
      TAU
    );

    ctx.fill();

  }

  ctx.globalAlpha = 1;


  /* balas */

  for (
    const bullet of bullets
  ) {

    ctx.strokeStyle =
      "#d9fbff";

    ctx.lineWidth = 3;

    ctx.lineCap =
      "round";

    ctx.beginPath();

    ctx.moveTo(
      bullet.x,
      bullet.y
    );

    ctx.lineTo(
      bullet.x -
      bullet.vx * .012,

      bullet.y -
      bullet.vy * .012
    );

    ctx.stroke();

  }


  /* tiros inimigos */

  for (
    const shot of enemyShots
  ) {

    ctx.fillStyle =
      "#ff799d";

    ctx.beginPath();

    ctx.arc(
      shot.x,
      shot.y,
      shot.r,
      0,
      TAU
    );

    ctx.fill();

  }


  /* inimigos */

  for (
    const enemy of enemies
  ) {

    drawEnemy(enemy);

  }


  /* jogador */

  drawPlayer();


  /* textos */

  ctx.textAlign =
    "center";

  ctx.font =
    "900 15px ui-monospace, monospace";

  for (
    const floating of floats
  ) {

    ctx.globalAlpha =
      clamp(
        floating.life / .8,
        0,
        1
      );

    ctx.fillStyle =
      floating.color;

    ctx.fillText(
      floating.text,
      floating.x,
      floating.y
    );

  }

  ctx.globalAlpha = 1;

  ctx.restore();


  /* flash */

  if (
    game.flash > 0
  ) {

    ctx.fillStyle =
      `rgba(255,82,119,${
        game.flash * .35
      })`;

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

  }


  /* pausa */

  if (
    game.paused
  ) {

    ctx.fillStyle =
      "rgba(2,9,18,.72)";

    ctx.fillRect(
      0,
      0,
      W,
      H
    );

    ctx.textAlign =
      "center";

    ctx.fillStyle =
      "#f4fbff";

    ctx.font =
      "900 30px ui-monospace, monospace";

    ctx.fillText(
      "PAUSADO",
      W / 2,
      H / 2
    );

    ctx.font =
      "13px ui-monospace, monospace";

    ctx.globalAlpha = .65;

    ctx.fillText(
      "P para continuar",
      W / 2,
      H / 2 + 28
    );

    ctx.globalAlpha = 1;

  }

}


/* =========================================================
   HUD
========================================================= */

const scoreEl =
  document.querySelector(
    "#score .val"
  );

const waveEl =
  document.querySelector(
    "#wave .val"
  );

const comboEl =
  document.getElementById(
    "combo"
  );

const hpEl =
  document.getElementById(
    "hpFill"
  );

const dashEl =
  document.getElementById(
    "dashFill"
  );

function syncHUD() {

  scoreEl.textContent =
    game.score.toLocaleString(
      "pt-BR"
    );

  waveEl.textContent =
    game.wave;

  hpEl.style.transform =
    `scaleX(${
      player.hp /
      player.maxHp
    })`;

  dashEl.style.transform =
    `scaleX(${
      1 -
      player.dashCooldown /
      CONFIG.dashCooldown
    })`;

  if (
    game.combo > 1
  ) {

    comboEl.textContent =
      "x" + game.combo;

    comboEl.classList.add(
      "on"
    );

  }

  else {

    comboEl.classList.remove(
      "on"
    );

  }

}


/* =========================================================
   TELAS
========================================================= */

const screen =
  document.getElementById(
    "screen"
  );

const panel =
  document.getElementById(
    "panel"
  );

function start() {

  audioOn();

  reset();

  game.state =
    "play";

  screen.classList.add(
    "hide"
  );

}


function gameOver() {

  game.state =
    "over";

  game.best =
    Math.max(
      game.best,
      game.score
    );

  localStorage.setItem(
    "nyeme-best",
    game.best
  );

  particleBurst(
    player.x,
    player.y,
    "#ff5277",
    70,
    500,
    .9
  );

  game.shake = 25;
  game.flash = .8;

  setTimeout(
    showGameOver,
    650
  );

}


function showGameOver() {

  panel.innerHTML = `

    <h1>
      FIM DE
      <span>JOGO</span>
    </h1>

    <p class="final">
      Pontuação
      <b>
        ${game.score.toLocaleString("pt-BR")}
      </b>
    </p>

    <p class="sub">
      Você chegou à onda ${game.wave}
    </p>

    <p class="best">
      Recorde: ${game.best.toLocaleString("pt-BR")}
    </p>

    <button id="againBtn">
      Jogar novamente
    </button>

  `;

  screen.classList.remove(
    "hide"
  );

  const again =
    document.getElementById(
      "againBtn"
    );

  again.onclick =
    start;

  again.focus();

}


/* =========================================================
   EVENTOS
========================================================= */

document
  .getElementById("startBtn")
  .onclick = start;

addEventListener(
  "mousedown",
  audioOn
);

addEventListener(
  "blur",
  () => {

    if (
      game.state === "play"
    ) {
      game.paused = true;
    }

  }
);


/* =========================================================
   LOOP
========================================================= */

reset();

let last =
  performance.now();

function loop(now) {

  let dt =
    (now - last) / 1000;

  last = now;

  /*
    Evita saltos enormes caso
    o navegador fique congelado.
  */

  dt =
    Math.min(
      dt,
      1 / 30
    );

  if (
    game.state === "play" &&
    !game.paused
  ) {

    update(
      dt * game.slow
    );

  }

  render();

  if (
    game.state === "play"
  ) {

    syncHUD();

  }

  requestAnimationFrame(
    loop
  );

}

requestAnimationFrame(
  loop
);

</script>

</body>
